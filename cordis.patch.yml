# dsh-tui bundle patch — the interactive terminal front door.
#
# This is the plugin layer that `dsh plugin --profile <name> add dsh-tui`
# applies over an official dsh-base profile. It is the TARGET for the
# official-client integration (see AGENTS.md → Architecture / Transition).
#
# NOTE: this patch assumes the official host plane (dsh-base) + the
# agent-presets roster are mounted by the profile. The personal dsh-tui
# currently boots a self-contained `runtime/cordis.yml` (no dsh-base); wiring
# this patch against a real dsh-base profile is part of the remaining
# integration (needs a running harness to verify).

# The interactive front door. The plugin creates/resumes its agent at runtime
# through the agent factory, subscribes to session events, and drives the TUI.
# `DSH_TUI_RESUME_SESSION` resumes a specific session; otherwise a fresh one is
# created.
- id: dsh-tui
  name: 'dsh-tui'
  inject: ['agents']
  config:
    provider: !!js process.env.DSH_TUI_PROVIDER ?? 'deepseek-official'
    model: !!js process.env.DSH_TUI_MODEL ?? undefined
    cwd: !!js process.env.DSH_TUI_CWD ?? undefined
    preset: !!js process.env.DSH_TUI_PRESET ?? undefined
    sessionId: !!js process.env.DSH_TUI_RESUME_SESSION ?? undefined
