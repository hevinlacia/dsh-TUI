# dsh-tui runtime composition for dsh-jsonrpc-agent.
#
# This tree is the runtime dsh-tui spawns. stdout is reserved for JSON-RPC
# protocol frames — do not add a console logger or terminal UI here.
#
# Plugin names resolve from this project's node_modules (devDependencies
# pinned to the harness 0.1.1-rc.2 line). The credential rows below mirror the
# official dsh-base bundle so an existing $DSH_HOME/settings.yaml route (e.g.
# a local llm-provider-router) is picked up unchanged; llm-deepseek remains
# the official-API fallback (DEEPSEEK_API_KEY).

# Out-of-process SDK surface: initialize / session/prompt / shutdown requests,
# session.event / session.status / subagent.* notifications.
- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
  config:
    maxTokensAsSuccess: !!js "process.env.DSH_MAX_TOKENS_AS_SUCCESS === undefined ? true : JSON.parse(process.env.DSH_MAX_TOKENS_AS_SUCCESS)"

# Official DeepSeek adapter fallback route (deepseek-official).
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    thinking: enabled
    reasoningEffort: max

# Settings-driven multi-provider adapter (dormant until $DSH_HOME/settings.yaml
# provides an llm-pi-ai section; the web Models page writes it).
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'

# User settings document + managed credentials (env, $DSH_HOME/.credentials.yaml,
# project/user .env fallbacks). Same rows as dsh-base.
- id: settings
  name: '@deepseek-ai/dsh-settings-file'

- id: credentials
  name: '@deepseek-ai/dsh-credentials-local'

# Managed child-process groups and the bash executor.
- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: bash
  name: '@deepseek-ai/dsh-bash-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()
    timeoutMs: 60000

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    persona: !!js process.env.DSH_SYSTEM_PROMPT ?? 'You are a coding agent.'
    workspaceContext: false
    skills:
      enabled: false
    toolBash:
      enableRunInBackground: false
    toolJobs: false

# Durable session log (authority for resume). dsh-tui keeps its own UI metadata
# registry; it never reads this log directly.
- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? './.sessions'
    compression: !!js "process.env.DSH_SNAPSHOT === undefined ? 'zstd' : 'none'"

- id: session-checkpoints
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

- id: subagent
  name: '@deepseek-ai/dsh-subagent'

- id: subagent-spawn-in-process
  name: '@deepseek-ai/dsh-subagent-spawn-in-process'
  config:
    providerName: spawn

- id: tool-subagent
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    enableRunInBackground: false

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# Code editing: file search + string-replace editor.
- id: fs-local
  name: '@deepseek-ai/dsh-fs-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()

- id: fs-observation-policy
  name: '@deepseek-ai/dsh-fs-observation-policy'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: str-replace-editor
  name: '@deepseek-ai/dsh-tool-str-replace-editor'
  config:
    maxOutputChars: 16000

- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.16
    maxTokens: 8192
    compactionRetries: 1