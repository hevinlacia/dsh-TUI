# dsh-tui runtime composition for dsh-jsonrpc-agent.
#
# This tree is the runtime dsh-tui spawns. stdout is reserved for JSON-RPC
# protocol frames — do not add a console logger or terminal UI here.
#
# Composition shape follows DeepSeek Harness's official services:
# agent-spine-demo is configured with Skills on, workspace (AGENTS.md) context
# at the standard 64KB cap, and the goal domain. Approval, question, plan-mode,
# command-goal, subagent (spawn + fork), fs-observation-policy and session-query
# are official DSH services mounted the same way a standard client composes them.
# (Design reference: the community dsh-TUI bare cordis.yml; our own tree, no code
# copied. Approval/ask-user answerers are not yet registered by the TUI, so the
# approval waterfall fail-closes to 'unavailable' — see docs/architecture.md.)

# User-question service: hosts `ctx.userQuestions`, the seam behind the
# model-facing ask_user_question tool. Must live at root so the agent loop's
# tool execution can reach it.
- id: user-questions
  name: '@deepseek-ai/dsh-user-questions'

# Approval service: the harness's sandbox escalation seam. Without a TUI
# answerer the waterfall fail-closes to 'unavailable' (safe), so this row is
# opt-in for the model-facing approval seam; policy mirrors a standard client.
- id: approval
  name: '@deepseek-ai/dsh-user-approval'
  config:
    policy: !!js "process.platform === 'win32' ? 'never' : ((process.env.DSH_PERMISSION_MODE ?? 'workspace-write') === 'danger-full-access' ? 'never' : 'ask')"

# Out-of-process SDK surface: initialize / session/prompt / shutdown requests,
# session.event / session.status / subagent.* notifications.
- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
  config:
    maxTokensAsSuccess: !!js "process.env.DSH_MAX_TOKENS_AS_SUCCESS === undefined ? true : JSON.parse(process.env.DSH_MAX_TOKENS_AS_SUCCESS)"

# Official DeepSeek adapter fallback route (deepseek-official).
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    thinking: enabled
    reasoningEffort: max

# Settings-driven multi-provider adapter (dormant until $DSH_HOME/settings.yaml
# provides an llm-pi-ai section; the web Models page writes it).
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'

# User settings document + managed credentials (env, $DSH_HOME/.credentials.yaml,
# project/user .env fallbacks). Same rows as dsh-base.
- id: settings
  name: '@deepseek-ai/dsh-settings-file'

- id: credentials
  name: '@deepseek-ai/dsh-credentials-local'

# Managed child-process groups and the bash executor.
- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: bash
  name: '@deepseek-ai/dsh-bash-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()
    timeoutMs: 60000

# Filesystem service + read/write/edit policy gate, then the model-facing tools.
- id: fs-local
  name: '@deepseek-ai/dsh-fs-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()

- id: fs-observation-policy
  name: '@deepseek-ai/dsh-fs-observation-policy'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: str-replace-editor
  name: '@deepseek-ai/dsh-tool-str-replace-editor'
  config:
    maxOutputChars: 16000

# todo_write tool: replaces the logged whole list (DSH's todo tool).
- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# Subagents: the registry service, then spawn/fork backends and the delegation
# tools. The core `dsh-subagent` service MUST mount before any provider.
- id: subagent
  name: '@deepseek-ai/dsh-subagent'

- id: subagent-spawn
  name: '@deepseek-ai/dsh-subagent-spawn-in-process'
  config:
    providerName: spawn

- id: subagent-fork
  name: '@deepseek-ai/dsh-subagent-fork-in-process'
  config:
    providerName: fork

- id: tool-subagent
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    backgroundMode: continuable
    maxDepth: 1

- id: tool-subagent-fork
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: fork
    toolName: subagent_fork
    backgroundMode: continuable
    maxDepth: 1

# The agent spine. Skills on (local SKILL.md discovery + catalog/load tools),
# workspace (AGENTS.md) context at the standard 64KB cap, and the goal domain.
- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    persona: !!js process.env.DSH_SYSTEM_PROMPT ?? 'You are a coding agent.'
    workspaceContext:
      maxBytes: 65536
    skills:
      enabled: true
    goals: {}
    toolBash:
      enableRunInBackground: false

# Human-command registry: plan-mode's /plan and command-goal's /goal register
# here; the TUI merges them into its slash menu and dispatches through the
# registry. Must mount before the commands below.
- id: commands
  name: '@deepseek-ai/dsh-commands'

- id: plan-mode
  name: '@deepseek-ai/dsh-plan-mode'
  config:
    section: |
      You are in plan mode. Explore and design before presenting the
      complete plan through exit_plan_mode.

- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'

# Durable session log (authority for resume). dsh-tui keeps its own UI metadata
# registry; it never reads this log directly.
- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? './.sessions'
    compression: !!js "process.env.DSH_SNAPSHOT === undefined ? 'zstd' : 'none'"

# Read-only session lineage — the subagent service's /agents listing reads it.
- id: session-query
  name: '@deepseek-ai/dsh-session-query'

- id: session-checkpoints
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

# Token accounting + manual session compaction.
- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.16
    maxTokens: 8192
    compactionRetries: 1
